<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Panel principal</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8f9fa; }
            .card-modulo { width: 220px; cursor: pointer; transition: transform .15s; }
            .card-modulo:hover { transform: translateY(-4px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
        </style>
    </head>
    <body>
        <div class="text-center">
            <h2 class="mb-2">Panel principal</h2>
            <p class="text-muted mb-5">Selecciona un módulo</p>

            <div class="d-flex gap-4 justify-content-center flex-wrap">

                <div class="card card-modulo">
                    <div class="card-body py-4">
                        <h5 class="card-title">Estudiantes</h5>
                        <p class="card-text text-muted small">Gestión de estudiantes</p>
                        <a href="estudiante.html" class="btn btn-primary w-100">Ir al módulo</a>
                    </div>
                </div>

                <div class="card card-modulo">
                    <div class="card-body py-4">
                        <h5 class="card-title">Cursos</h5>
                        <p class="card-text text-muted small">Gestión de cursos</p>
                        <a href="curso.html" class="btn btn-primary w-100">Ir al módulo</a>
                    </div>
                </div>

                <div class="card card-modulo">
                    <div class="card-body py-4">
                        <h5 class="card-title">Usuarios</h5>
                        <p class="card-text text-muted small">Gestión de usuarios</p>
                        <a href="usuario.html" class="btn btn-primary w-100">Ir al módulo</a>
                    </div>
                </div>

            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
