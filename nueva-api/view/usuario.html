<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Usuarios</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container mt-4">
            <div class="d-flex align-items-center gap-3 mb-3">
                <a href="index.html" class="btn btn-outline-secondary btn-sm">← Volver</a>
                <h2 class="mb-0">Usuarios</h2>
            </div>

            <!-- ── Formulario insertar ───────────────────────────────────── -->
            <form id="formulario" class="row g-2 mb-4">
                <div class="col-md-3">
                    <input type="text"     class="form-control" id="name"     placeholder="Nombre de usuario" />
                </div>
                <div class="col-md-4">
                    <input type="email"    class="form-control" id="email"    placeholder="Correo electrónico" />
                </div>
                <div class="col-md-3">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" />
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Insertar</button>
                </div>
            </form>

            <!-- ── Tabla ─────────────────────────────────────────────────── -->
            <div class="table-responsive">
                <table class="table table-primary table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Contraseña</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuario"></tbody>
                </table>
            </div>
        </div>

        <!-- ── Modal Editar ──────────────────────────────────────────────── -->
        <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEditarLabel">Editar Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit_id" />
                        <div class="mb-3">
                            <label class="form-label">Email (solo lectura)</label>
                            <input type="email" class="form-control" id="edit_email" readonly />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="edit_name" placeholder="Nombre de usuario" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" class="form-control" id="edit_password" placeholder="Nueva contraseña" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-warning"   id="btnGuardarEdicion">Guardar cambios</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Modal Enviar Email ─────────────────────────────────────────── -->
        <div class="modal fade" id="modalEmail" tabindex="-1" aria-labelledby="modalEmailLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEmailLabel">Enviar Email</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Destinatario</label>
                            <input type="email" class="form-control" id="mail_email" readonly />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Asunto</label>
                            <input type="text" class="form-control" id="mail_title" placeholder="Asunto del mensaje" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mail_text" rows="4" placeholder="Escribe el mensaje aquí..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary"   id="btnEnviarEmail">Enviar</button>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="../controllers/usuarioController.js"></script>
    </body>
</html>
