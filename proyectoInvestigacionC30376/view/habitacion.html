<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <link rel="stylesheet" href="theme.css"/>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Hotel, Trivago</a>
            <ul class="navbar-nav gap-1">
                <li class="nav-item"><a class="nav-link" href="hotel.html">Hoteles</a></li>
                <li class="nav-item"><a class="nav-link" href="sede.html">Sedes</a></li>
                <li class="nav-item"><a class="nav-link active" href="habitacion.html">Habitaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="cliente.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="reservacion.html">Reservaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="pago.html">Pagos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-3">Habitaciones</h2>

        <!-- Insertar -->
        <form id="formInsertar" class="row g-2 mb-4">
            <div class="col-md-1"><input type="number" class="form-control" id="id_sede"     placeholder="ID Sede" required/></div>
            <div class="col-md-1"><input type="text"   class="form-control" id="numero"      placeholder="Número" required/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="tipo"        placeholder="Tipo (Suite, Doble…)" required/></div>
            <div class="col-md-3"><input type="text"   class="form-control" id="descripcion" placeholder="Descripción"/></div>
            <div class="col-md-1"><input type="number" class="form-control" id="precio"      placeholder="Precio" step="0.01"/></div>
            <div class="col-md-1"><input type="number" class="form-control" id="capacidad"   placeholder="Cap."/></div>
            <div class="col-md-2">
                <select class="form-select" id="estado">
                    <option value="Disponible">Disponible</option>
                    <option value="Ocupada">Ocupada</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                </select>
            </div>
            <div class="col-md-1"><input type="text"   class="form-control" id="usuario"    placeholder="Usuario" required/></div>
            <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">+</button></div>
        </form>

        <!-- Tabla -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Sede</th><th>Número</th><th>Tipo</th><th>Precio</th><th>Capacidad</th><th>Estado</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Habitación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-2">
                    <input type="hidden" id="edit_id"/>
                    <div class="col-4"><input type="text"   class="form-control" id="edit_numero"      placeholder="Número"/></div>
                    <div class="col-8"><input type="text"   class="form-control" id="edit_tipo"        placeholder="Tipo"/></div>
                    <div class="col-12"><input type="text"  class="form-control" id="edit_descripcion" placeholder="Descripción"/></div>
                    <div class="col-4"><input type="number" class="form-control" id="edit_precio"      placeholder="Precio" step="0.01"/></div>
                    <div class="col-4"><input type="number" class="form-control" id="edit_capacidad"   placeholder="Capacidad"/></div>
                    <div class="col-4">
                        <select class="form-select" id="edit_estado">
                            <option value="Disponible">Disponible</option>
                            <option value="Ocupada">Ocupada</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                    <div class="col-12"><input type="text"  class="form-control" id="edit_usuario"     placeholder="Usuario"/></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning"   id="btnGuardar">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../controllers/habitacionController.js"></script>
</body>
</html>
