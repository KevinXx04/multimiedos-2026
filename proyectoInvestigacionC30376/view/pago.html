<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <link rel="stylesheet" href="theme.css"/>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Hotel, Trivago</a>
            <ul class="navbar-nav gap-1">
                <li class="nav-item"><a class="nav-link" href="hotel.html">Hoteles</a></li>
                <li class="nav-item"><a class="nav-link" href="sede.html">Sedes</a></li>
                <li class="nav-item"><a class="nav-link" href="habitacion.html">Habitaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="cliente.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="reservacion.html">Reservaciones</a></li>
                <li class="nav-item"><a class="nav-link active" href="pago.html">Pagos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-3">Pagos</h2>

        <!-- Insertar -->
        <form id="formInsertar" class="row g-2 mb-4">
            <div class="col-md-1"><input type="number" class="form-control" id="id_reservacion" placeholder="ID Res." required/></div>
            <div class="col-md-2"><input type="number" class="form-control" id="monto"          placeholder="Monto" step="0.01" required/></div>
            <div class="col-md-2">
                <select class="form-select" id="metodo">
                    <option value="">Método</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>
            <div class="col-md-2"><input type="text"     class="form-control" id="detalle"    placeholder="Detalle"/></div>
            <div class="col-md-2">
                <select class="form-select" id="estado">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Pagado">Pagado</option>
                    <option value="Rechazado">Rechazado</option>
                </select>
            </div>
            <div class="col-md-2"><input type="datetime-local" class="form-control" id="fecha_pago"/></div>
            <div class="col-md-1"><input type="text"     class="form-control" id="usuario"    placeholder="Usuario" required/></div>
            <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">+</button></div>
        </form>

        <!-- Tabla -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Reservación</th><th>Monto</th><th>Método</th><th>Estado</th><th>Fecha</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-2">
                    <input type="hidden" id="edit_id"/>
                    <div class="col-6"><input type="number" class="form-control" id="edit_monto" placeholder="Monto" step="0.01"/></div>
                    <div class="col-6">
                        <select class="form-select" id="edit_metodo">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                    </div>
                    <div class="col-12"><input type="text" class="form-control" id="edit_detalle" placeholder="Detalle"/></div>
                    <div class="col-6">
                        <select class="form-select" id="edit_estado">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Pagado">Pagado</option>
                            <option value="Rechazado">Rechazado</option>
                        </select>
                    </div>
                    <div class="col-6"><input type="datetime-local" class="form-control" id="edit_fecha_pago"/></div>
                    <div class="col-12"><input type="text" class="form-control" id="edit_usuario" placeholder="Usuario"/></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning"   id="btnGuardar">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../controllers/pagoController.js"></script>
</body>
</html>
