<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sedes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Hotel Manager</a>
            <ul class="navbar-nav gap-1">
                <li class="nav-item"><a class="nav-link" href="hotel.html">Hoteles</a></li>
                <li class="nav-item"><a class="nav-link active" href="sede.html">Sedes</a></li>
                <li class="nav-item"><a class="nav-link" href="habitacion.html">Habitaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="cliente.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="reservacion.html">Reservaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="pago.html">Pagos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-3">Sedes</h2>

        <!-- Insertar -->
        <form id="formInsertar" class="row g-2 mb-4">
            <div class="col-md-1"><input type="number" class="form-control" id="id_hotel"              placeholder="ID Hotel" required/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="nombre"                placeholder="Nombre" required/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="pais"                  placeholder="País"/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="provincia"             placeholder="Provincia"/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="ciudad"                placeholder="Ciudad"/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="direccion"             placeholder="Dirección"/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="telefono"              placeholder="Teléfono"/></div>
            <div class="col-md-2"><input type="email"  class="form-control" id="correo"                placeholder="Correo"/></div>
            <div class="col-md-1"><input type="number" class="form-control" id="cantidad_habitaciones" placeholder="Hab."/></div>
            <div class="col-md-2"><input type="text"   class="form-control" id="usuario"               placeholder="Usuario" required/></div>
            <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">+</button></div>
        </form>

        <!-- Tabla -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Hotel</th><th>Nombre</th><th>País</th><th>Ciudad</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Sede</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-2">
                    <input type="hidden" id="edit_id"/>
                    <div class="col-3"> <input type="number" class="form-control" id="edit_id_hotel"              placeholder="ID Hotel"/></div>
                    <div class="col-9"> <input type="text"   class="form-control" id="edit_nombre"                placeholder="Nombre"/></div>
                    <div class="col-4"> <input type="text"   class="form-control" id="edit_pais"                  placeholder="País"/></div>
                    <div class="col-4"> <input type="text"   class="form-control" id="edit_provincia"             placeholder="Provincia"/></div>
                    <div class="col-4"> <input type="text"   class="form-control" id="edit_ciudad"                placeholder="Ciudad"/></div>
                    <div class="col-12"><input type="text"   class="form-control" id="edit_direccion"             placeholder="Dirección"/></div>
                    <div class="col-6"> <input type="text"   class="form-control" id="edit_telefono"              placeholder="Teléfono"/></div>
                    <div class="col-6"> <input type="email"  class="form-control" id="edit_correo"                placeholder="Correo"/></div>
                    <div class="col-6"> <input type="number" class="form-control" id="edit_cantidad_habitaciones" placeholder="Cantidad habitaciones"/></div>
                    <div class="col-6"> <input type="text"   class="form-control" id="edit_usuario"               placeholder="Usuario"/></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning"   id="btnGuardar">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../controllers/sedeController.js"></script>
</body>
</html>
