<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi paginita tope de gamma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Contáctame</h1>

    <nav>
        <a href="index.html">Volver al inicio</a>
    </nav>

    <div class="contenido">

        <section id="contacto-form">
            <h2>Formulario de contacto</h2>
            <form action="#" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>

                <div class="form-buttons">
                    <button type="submit">Enviar mensaje</button>
                    <button type="reset">Limpiar</button>
                </div>
            </form>
        </section>

    </div>

    <footer>
        <p>2026 - Kevincio Alvarado Vargas | <a href="index.html">Inicio</a></p>
    </footer>

</body>
</html>
