<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi paginita tope de gamma</title>
</head>
<body>

    <h1>Contáctame</h1>

    <nav>
        <a href="index.html">Volver al inicio</a>
    </nav>

    <hr>

    <form action="#" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br><br>

        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required><br><br>

        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe tu mensaje aquí..." required></textarea><br><br>

        <button type="submit">Enviar mensaje</button>
        <button type="reset">Limpiar</button>
    </form>

    <hr>

    <footer>
        <p>2026 - Kevincio Alvarado Vargas | <a href="index.html">Inicio</a></p>
    </footer>

</body>
</html>
