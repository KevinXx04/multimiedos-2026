<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi paginita tope de gamma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Encabezado -->
    <header class="bg-dark text-white text-center py-5">
        <div class="container">
            <h1 class="display-5 fw-bold">Contáctame</h1>
            <p class="lead">¿Tienes algo que decirme? Aquí estoy.</p>
        </div>
    </header>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-secondary">
        <div class="container">
            <a class="btn btn-outline-light btn-sm" href="index.html">← Volver al inicio</a>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h2 class="h4 mb-0">Formulario de contacto</h2>
                    </div>
                    <div class="card-body">
                        <form action="#" method="post">

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Tu nombre"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    placeholder="tucorreo@ejemplo.com"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                                <textarea
                                    class="form-control"
                                    id="mensaje"
                                    name="mensaje"
                                    rows="5"
                                    placeholder="Escribe tu mensaje aquí..."
                                    required
                                ></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-dark">Enviar mensaje</button>
                                <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-4">
        <div class="container">
            <p class="mb-1">2026 - Kevincio Alvarado Vargas</p>
            <a href="index.html" class="btn btn-outline-warning btn-sm">Inicio</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
